<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc">
<title id="title">ForceTwin: measured interaction to a physics-informed twin</title>
<desc id="desc">Human probing with an instrumented gripper provides poses and contact wrenches. Identify articulation and dynamics, register them to geometry, then use the twin for control or simulation policy training and real deployment.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#46616e" stroke-width="1.5"/></marker></defs>
