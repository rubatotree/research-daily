<g font-family="DejaVu Sans, sans-serif" fill="#173340">
<text x="32" y="45" font-size="27" font-weight="bold">ForceTwin / measure the force, not just the motion</text>
<text x="32" y="75" font-size="17">Editorial diagram based on arXiv:2609.21751v1; not an author figure.</text>
<g fill="#fff" stroke="#9cb6c2" stroke-width="2"><rect x="32" y="115" width="305" height="140" rx="12"/><rect x="398" y="115" width="324" height="140" rx="12"/><rect x="784" y="115" width="304" height="140" rx="12"/></g>
