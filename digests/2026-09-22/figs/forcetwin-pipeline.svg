<g font-size="17"><text x="50" y="184">Human effort + calibration</text><text x="50" y="213">Poses + contact wrenches</text><text x="416" y="184">Joint / inertia / friction</text><text x="416" y="213">Damping + mechanism residual</text><text x="802" y="184">Register with geometry</text><text x="802" y="213">Export to target backend</text></g>
