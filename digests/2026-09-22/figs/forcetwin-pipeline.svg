<g fill="#e2efeb"><rect x="80" y="317" width="460" height="70" rx="12"/><rect x="580" y="317" width="460" height="70" rx="12"/></g>
<g font-size="19"><text x="99" y="345">Control: dynamics compensation</text><text x="99" y="372">Real Spot / Franka FR3 evaluation</text><text x="599" y="345">Learning: simulation policy training</text><text x="599" y="372">Real door-traversal deployment</text></g>
<text x="32" y="433" font-size="19" font-weight="bold">Extra priors: force-sensing hardware; rigid grasp; single-DoF articulation.</text>
