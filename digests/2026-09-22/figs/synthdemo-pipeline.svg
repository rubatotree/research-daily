<g fill="none" stroke="#46616e" stroke-width="2.5" marker-end="url(#a)"><path d="M278 172H306"/><path d="M556 172H584"/><path d="M799 172H826"/><path d="M529 240V272H336V244"/></g>
<text x="322" y="298" font-size="17">Failed trials revise the teacher</text>
