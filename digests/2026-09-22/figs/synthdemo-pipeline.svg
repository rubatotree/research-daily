<g font-family="DejaVu Sans, sans-serif" fill="#173340">
<text x="32" y="45" font-size="27" font-weight="bold">SynthDemo-RL / success before sparse-reward learning</text>
<text x="32" y="75" font-size="17">Editorial diagram based on arXiv:2609.21650v1; not an author figure.</text>
<g fill="#fff" stroke="#9cb6c2" stroke-width="2"><rect x="32" y="110" width="245" height="130" rx="12"/><rect x="310" y="110" width="245" height="130" rx="12"/><rect x="588" y="110" width="210" height="130" rx="12"/><rect x="830" y="110" width="258" height="130" rx="12"/></g>
