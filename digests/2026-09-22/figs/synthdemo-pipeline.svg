<text x="51" y="356" font-size="20" font-weight="bold">Evidence boundary: real open-loop replay is NOT closed-loop visual transfer.</text>
<text x="51" y="385" font-size="17">The paper reports successful replay, but unsuccessful preliminary real-camera closed-loop tests.</text>
