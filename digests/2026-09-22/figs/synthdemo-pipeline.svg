<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
<title id="title">SynthDemo-RL: teacher generation, policy training, and evidence boundary</title>
<desc id="desc">Privileged simulator state feeds a teacher and executor. Failure feedback revises demonstrations. Successful demonstrations train a VLA through SFT and PPO. Real open-loop replay does not establish closed-loop visual transfer.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#46616e" stroke-width="1.5"/></marker></defs>
