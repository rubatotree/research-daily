<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>科研日报</title>
  <link rel="stylesheet" href="assets/site.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="日期导航">
      <div class="rail-head">
        <div class="logo">科研日报</div>
        <div class="month-nav">
          <button type="button" id="prevMonth" aria-label="上一月">‹</button>
          <span id="monthLabel"></span>
          <button type="button" id="nextMonth" aria-label="下一月">›</button>
        </div>
      </div>

      <div class="calendar" id="calendar"></div>

      <div class="timeline-label">时间轴</div>
      <ul class="timeline" id="timeline"></ul>

      <div class="rail-foot">
        <a href="https://github.com/rubatotree/research-daily">GitHub</a>
        <a href="meta/digest-spec.md">规范</a>
      </div>
    </aside>

    <main class="stage">
      <article id="content" class="content">
        <p class="muted">加载中…</p>
      </article>
    </main>
  </div>
  <script src="assets/app.js"></script>
</body>
</html>
